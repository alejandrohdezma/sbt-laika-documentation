<header id="top-bar" class="${helium.site.topNavigation.style}">

  <div class="row">
    <a id="nav-icon">
      @:icon(navigationMenu)
    </a>
    <a class="brand" href="@:target(/README)">
      @:for(documentation.logo)<img src="@:target(documentation.logo)" alt="${documentation.title} logo">@:@
      <b>${documentation.title}</b>
    </a>
    <a class="nav-item" href="@:target(documentation.startPage)">Docs</a>
    @:for(documentation.links)
    <a class="nav-item" href="${_.url}" target="_blank" rel="noopener noreferrer">${_.title}<svg class="external-link-icon" width="13.5" height="13.5" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M21 13v10h-21v-19h12v2h-10v15h17v-8h2zm3-12h-10.988l4.035 4-6.977 7.07 2.828 2.828 6.977-7.07 4.125 4.172v-11z"></path></svg></a>
    @:@
  </div>

  <div class="row links">
    @:for(helium.site.topNavigation.links)
    ${_}
    @:@
  </div>

  <div class="row search-row">
    <button id="search-button" class="search-button" type="button" aria-label="Search">
      <svg class="search-icon" width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M14.386 14.386l4.088 4.088-4.088-4.088A7.533 7.533 0 1 1 3.733 3.733a7.533 7.533 0 0 1 10.653 10.653z" stroke="currentColor" fill="none" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      <span class="search-button-placeholder">Search</span>
      <span class="search-keys"><kbd class="modifier">⌘</kbd><kbd>K</kbd></span>
    </button>
  </div>

  <div id="search-modal" class="search-container" hidden>
    <div class="search-dialog" role="dialog" aria-modal="true" aria-label="Search">
      <form class="search-form" role="search">
        <svg class="search-icon" width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M14.386 14.386l4.088 4.088-4.088-4.088A7.533 7.533 0 1 1 3.733 3.733a7.533 7.533 0 0 1 10.653 10.653z" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        <input id="search-input" class="search-input" type="search" placeholder="Search docs" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="go" aria-controls="search-results">
        <button class="search-clear" type="reset" hidden>Clear the query</button>
        <button class="search-close" type="button" aria-label="Close search">
          <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 10l5.09-5.09L10 10l5.09 5.09L10 10zm0 0L4.91 4.91 10 10l-5.09 5.09L10 10z" stroke="currentColor" fill="none" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        </button>
      </form>
      <div id="search-results" class="search-results" role="listbox"></div>
      <div class="search-footer">
        <ul class="search-commands">
          <li><kbd>↵</kbd><span>to select</span></li>
          <li><kbd>↓</kbd><kbd>↑</kbd><span>to navigate</span></li>
          <li><kbd>esc</kbd><span>to close</span></li>
        </ul>
      </div>
    </div>
  </div>

</header>
